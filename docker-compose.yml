# ---------------------------------------------------------------------------
# ResuNet local development stack.
#
# Mongo runs as a single-node replica set because the application-submission
# flow writes across `applications` and `resume_versions` in one transaction,
# and multi-document transactions require a replica set even locally.
# ---------------------------------------------------------------------------
name: resunet

services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      # Initiates the replica set on first boot, then reports healthy once
      # a primary has been elected.
      test: >
        mongosh --quiet --eval "
          try { rs.status().ok }
          catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}).ok }
        "
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MONGODB_URI: mongodb://mongo:27017/?replicaSet=rs0&directConnection=true
      MONGODB_DB: ${MONGODB_DB:-resunet}
      REDIS_URI: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-openssl-rand-hex-32}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-30}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      RESUME_AGENT_MODEL: ${RESUME_AGENT_MODEL:-claude-sonnet-4-5-20250929}
      RESUME_AGENT_TEMPERATURE: ${RESUME_AGENT_TEMPERATURE:-0.2}
      XYZ_MAX_REPAIR_ATTEMPTS: ${XYZ_MAX_REPAIR_ATTEMPTS:-3}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      RENDER_STORAGE_DIR: /srv/storage/renders
      LATEX_COMPILE_TIMEOUT_SECONDS: ${LATEX_COMPILE_TIMEOUT_SECONDS:-45}
      RENDER_MAX_TRIES: ${RENDER_MAX_TRIES:-2}
      RENDER_RETRY_DELAY_SECONDS: ${RENDER_RETRY_DELAY_SECONDS:-10}
      AUTOMATION_MAX_ATTEMPTS: ${AUTOMATION_MAX_ATTEMPTS:-3}
      # The API must not receive either automation secret.
      CREDENTIAL_ENCRYPTION_KEY: ""
      AUTOMATION_PROXY_URL: ""
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/srv/api
      - render_storage:/srv/storage/renders
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  render-worker:
    build:
      context: .
      dockerfile: infra/docker/render-worker.Dockerfile
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MONGODB_URI: mongodb://mongo:27017/?replicaSet=rs0&directConnection=true
      MONGODB_DB: ${MONGODB_DB:-resunet}
      REDIS_URI: redis://redis:6379/0
      RENDER_STORAGE_DIR: /srv/storage/renders
      LATEX_COMPILE_TIMEOUT_SECONDS: ${LATEX_COMPILE_TIMEOUT_SECONDS:-45}
    volumes:
      - ./apps/render-worker:/srv/render-worker
      - render_storage:/srv/storage/renders
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["arq", "worker.main.WorkerSettings"]

  automation-worker:
    build:
      context: .
      dockerfile: infra/docker/automation-worker.Dockerfile
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MONGODB_URI: mongodb://mongo:27017/?replicaSet=rs0&directConnection=true
      MONGODB_DB: ${MONGODB_DB:-resunet}
      REDIS_URI: redis://redis:6379/0
      RENDER_STORAGE_DIR: /srv/storage/renders
      TRACE_STORAGE_DIR: /srv/storage/traces
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
      AUTOMATION_PROXY_URL: ${AUTOMATION_PROXY_URL:-}
      AUTOMATION_ALLOWED_HOSTS: ${AUTOMATION_ALLOWED_HOSTS:-localhost,127.0.0.1}
      AUTOMATION_REQUIRE_APPROVAL: ${AUTOMATION_REQUIRE_APPROVAL:-true}
      AUTOMATION_HEADLESS: ${PLAYWRIGHT_HEADLESS:-true}
      AUTOMATION_MAX_ATTEMPTS: ${AUTOMATION_MAX_ATTEMPTS:-3}
      AUTOMATION_NAV_TIMEOUT_MS: ${AUTOMATION_NAV_TIMEOUT_MS:-30000}
    # Chromium needs more shared memory than Docker's 64MB default or it
    # crashes on content-heavy pages.
    shm_size: "1gb"
    volumes:
      - ./apps/automation-worker:/srv/automation-worker
      - render_storage:/srv/storage/renders:ro
      - automation_traces:/srv/storage/traces
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["arq", "worker.main.WorkerSettings"]

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    environment:
      # Server Components and route handlers fetch FastAPI from inside the
      # compose network. localhost:8000 is the host's published port, not
      # reachable as "localhost" from the web container.
      API_BASE_URL: http://api:8000
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/srv/apps/web
      - ./packages/shared:/srv/packages/shared
      - web_node_modules:/srv/apps/web/node_modules
    depends_on:
      - api
    command: ["pnpm", "dev"]

volumes:
  mongo_data:
  redis_data:
  render_storage:
  automation_traces:
  web_node_modules:
